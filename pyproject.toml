[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracy"
dynamic = ["version"]
description = "Self-hostable working-time tracker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
  "sqlalchemy>=2.0.52",
  "greenlet>=3.5.5",
  "alembic>=1.19.1",
  "asyncpg>=0.31.0",
  "aiosqlite>=0.22.1",
  "pydantic-settings>=2.15.0",
  "python-jose[cryptography]>=3.5.0",
  "jinja2>=3.1.6",
  "itsdangerous>=2.2.0",
  "fastpasskey @ https://github.com/Malaber/python-libs/releases/download/fastpasskey-v0.2.6/fastpasskey-0.2.6-py3-none-any.whl#sha256=b66a362eb0805860692e1d01bc51db16c8a832a684453a8c825bfe9788d0d19e",
]

[project.optional-dependencies]
dev = [
  "invoke>=3.0.3",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "httpx>=0.28.1",
  "black==26.5.1",
  "flake8>=7.3.0",
]

[tool.setuptools_scm]
fallback_version = "0.1.0"
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".venv"]
