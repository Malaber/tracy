name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', 'tasks.py', '.codex/setup.sh', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'tasks.py', '.codex/setup.sh', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      IOS_RUNTIME_BUILD: ${{ matrix.runtime_build }}
      IOS_RUNTIME_ID: ${{ matrix.runtime_id }}
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 18 Pro
            runtime_build: 24A434
            runtime_id: com.apple.CoreSimulator.SimRuntime.iOS-27-0
          - device: iPad Pro 13-inch (M5)
            runtime_build: 24A434
            runtime_id: com.apple.CoreSimulator.SimRuntime.iOS-27-0
          - device: iPhone Duo
            runtime_build: 24A94232
            runtime_id: com.apple.CoreSimulator.SimRuntime.iOS-27-1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify matching Xcode build
        run: |
          xcodebuild -version
          test "$(xcodebuild -version)" = "$(printf 'Xcode 27.1\nBuild version 27A9275')"
      - name: Install matching simulator runtime
        run: |
          if ! xcrun simctl list runtimes --json | python3 -c '
          import json, os, sys
          expected = os.environ["IOS_RUNTIME_BUILD"]
          installed = any(r["identifier"] == os.environ["IOS_RUNTIME_ID"]
                          and r["buildversion"] == expected and r["isAvailable"]
                          for r in json.load(sys.stdin)["runtimes"])
          sys.exit(0 if installed else 1)
          '; then
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_RUNTIME_BUILD" -architectureVariant arm64
          fi
      - name: Verify matching simulator build
        run: |
          xcrun simctl list runtimes --json > /tmp/tracy-runtimes.json
          python3 - <<'PYTHON'
          import json
          import os
          with open("/tmp/tracy-runtimes.json") as source:
              runtimes = json.load(source)["runtimes"]
          runtime = next(r for r in runtimes if r["identifier"] == os.environ["IOS_RUNTIME_ID"])
          expected = os.environ["IOS_RUNTIME_BUILD"]
          actual = runtime["buildversion"]
          if not runtime["isAvailable"] or actual != expected:
              raise SystemExit(f"Expected available iOS runtime {expected}; found {actual}, available={runtime['isAvailable']}")
          print(f"Verified iOS {runtime['version']} build {actual}")
          PYTHON
      - run: .codex/setup.sh --ios
      - run: brew install xcodegen
      - run: .venv/bin/inv check-ios-package
      - run: .venv/bin/inv build-ios-simulator
      - name: Create isolated simulator
        id: simulator
        env:
          DEVICE_NAME: ${{ matrix.device }}
        run: |
          device_id=$(xcrun simctl create "Tracy CI" "$DEVICE_NAME" "$IOS_RUNTIME_ID")
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl ui "$device_id" appearance light
      - name: Native UI smoke tests
        run: .venv/bin/inv check-ios-ui --destination="platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
      - name: Remove isolated simulator
        if: always() && steps.simulator.outputs.id != ''
        run: xcrun simctl delete "${{ steps.simulator.outputs.id }}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.device }}
          path: ios/TracyIOS/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
